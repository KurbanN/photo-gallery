                <script>
        // Wait for both DOM and Alpine to be ready
        function initForm() {
            const wrapper = document.getElementById('responseFormWrapper');
            const form = document.getElementById('responseForm');

            if (!form) return;

            const editButton = document.querySelector('.edit__submit');
            if (editButton) {
                editButton.addEventListener('click', () => {
                    form.classList.remove('form--success');
                });
            }

            const messages = {
                submitting: wrapper.dataset.submittingText,
                success: wrapper.dataset.successMessage,
                error: wrapper.dataset.errorMessage,
                validation: wrapper.dataset.validationError,
                invalidJson: wrapper.dataset.invalidJsonResponse,
            };

            // Helper function to show alerts
            function showAlert(type, message) {
                try {
                    if (window.Alpine && window.Alpine.store) {
                        window.Alpine.store('alerts').add(type, message);
                    } else {
                        console.warn('Alpine alerts store not available:', message);
                    }
                } catch (error) {
                    console.error('Error showing alert:', error, message);
                }
            }

            // --- Кастомные селекты ---
            document.querySelectorAll('.card_form__other').forEach(parent => {
                const controlInput = parent.querySelector('.card_form__radio input');
                const textInput = parent.querySelector('.card_form__input');
                if (controlInput && textInput) {
                    // Существующий обработчик для checkbox/radio
                    controlInput.addEventListener('change', e => {
                        if (controlInput.checked) {
                            textInput.focus();
                        }
                    });

                    // Новый обработчик для поля ввода
                    textInput.addEventListener('input', e => {
                        if (textInput.value.trim() !== '') {
                            controlInput.checked = true;
                        }
                    });
                }
            });

            document.querySelectorAll('.custom-select').forEach(select => {
                const selected = select.querySelector('.custom-select__selected');
                const selectedLabel = select.querySelector('.custom-select__label');
                const options = select.querySelector('.custom-select__options');
                const hiddenInput = select.querySelector('input[type="hidden"]');
                const optionElements = options.querySelectorAll('.custom-select__option');
                const placeholder = select.dataset.placeholder || 'Выберите...';
                let activeIndex = -1;

                if (hiddenInput.value === 'Choose an option' || !hiddenInput.value) {
                    select.classList.add('empty');
                    selectedLabel.textContent = placeholder;
                } else {
                    select.classList.remove('empty');
                }

                const open = () => {
                    const rect = select.getBoundingClientRect();
                    const spaceBelow = window.innerHeight - rect.bottom;
                    const spaceAbove = rect.top;
                    if (spaceBelow < 200 && spaceAbove > 200) {
                        select.classList.add('drop-up');
                    } else {
                        select.classList.remove('drop-up');
                    }
                    select.classList.add('open');
                };

                const close = () => {
                    select.classList.remove('open');
                    select.classList.remove('drop-up');
                    activeIndex = -1;
                    updateActive();
                };

                const toggle = () => {
                    if (select.classList.contains('open')) {
                        close();
                    } else {
                        open();
                    }
                };

                const updateActive = () => {
                    optionElements.forEach((opt, idx) => {
                        opt.classList.toggle('active', idx === activeIndex);
                    });
                };

                const selectOption = (index) => {
                    if (index >= 0 && index < optionElements.length) {
                        const option = optionElements[index];
                        const value = option.getAttribute('data-value');
                        const label = option.textContent;
                        hiddenInput.value = value;
                        selectedLabel.textContent = label;
                        optionElements.forEach(opt => opt.classList.remove('active'));
                        option.classList.add('active');
                        close();
                    }
                };

                selected.addEventListener('click', toggle);
                optionElements.forEach((option, idx) => {
                    option.addEventListener('click', () => {
                        selectOption(idx);
                    });
                });

                document.addEventListener('click', e => {
                    if (!select.contains(e.target)) {
                        close();
                    }
                });

                select.addEventListener('keydown', e => {
                    const key = e.key;
                    if (key === 'Enter' || key === ' ') {
                        e.preventDefault();
                        if (select.classList.contains('open')) {
                            selectOption(activeIndex);
                        } else {
                            open();
                        }
                    }
                    if (key === 'ArrowDown') {
                        e.preventDefault();
                        open();
                        activeIndex = (activeIndex + 1) % optionElements.length;
                        updateActive();
                    }
                    if (key === 'ArrowUp') {
                        e.preventDefault();
                        open();
                        activeIndex = (activeIndex - 1 + optionElements.length) % optionElements
                            .length;
                        updateActive();
                    }
                    if (key === 'Escape') {
                        close();
                    }
                });

                selectedLabel.textContent = placeholder;
            });

            // --- Отправка формы ---
            // RSVP: bridge script handles submit
            // --- Вспомогательные функции ---

            function collectFormData() {
                const formData = {};
                form.querySelectorAll('.card_form__input[data-field-id], textarea[data-field-id]').forEach(
                    input => {
                        formData[input.dataset.fieldId] = input.value || '';
                    });
                form.querySelectorAll('input[type="radio"]:checked').forEach(radio => {
                    if (!radio.dataset.fieldId) return;
                    if (radio.closest('.card_form__other')) {
                        const otherInput = radio.closest('.card_form__other').querySelector(
                            '.card_form__input');
                        formData[radio.dataset.fieldId] = otherInput ? otherInput.value : 'Other';
                    } else {
                        formData[radio.dataset.fieldId] = radio.value;
                    }
                });
                const checkboxFields = new Set();
                form.querySelectorAll('input[type="checkbox"][data-field-id]').forEach(checkbox => {
                    checkboxFields.add(checkbox.dataset.fieldId);
                });
                checkboxFields.forEach(fieldId => {
                    formData[fieldId] = [];
                });
                form.querySelectorAll('input[type="checkbox"][data-field-id]:checked').forEach(checkbox => {
                    if (checkbox.closest('.card_form__other')) {
                        const otherInput = checkbox.closest('.card_form__other').querySelector(
                            '.card_form__input');
                        formData[checkbox.dataset.fieldId].push(otherInput ? otherInput.value : 'Other');
                    } else {
                        formData[checkbox.dataset.fieldId].push(checkbox.value);
                    }
                });
                form.querySelectorAll('.custom-select input[type="hidden"][data-field-id]').forEach(input => {
                    const value = input.value;
                    const placeholder = input.dataset.placeholder;
                    const fieldContainer = input.closest('.card_form');
                    const isRequired = fieldContainer.querySelector('.form_question span') !== null;

                    // Пропускаем незаполненные необязательные поля
                    if (!isRequired && (!value || value === placeholder)) {
                        return;
                    }

                    formData[input.dataset.fieldId] = value;
                });
                return formData;
            }

            function clearFormErrors() {
                form.querySelectorAll('.card_form__error').forEach(errorEl => {
                    errorEl.remove();
                });
                form.querySelectorAll('.card_form__input.error, textarea.error').forEach(input => {
                    input.classList.remove('error');
                });
                form.querySelectorAll('.card_form--error').forEach(formGroup => {
                    formGroup.classList.remove('card_form--error');
                });
            }

            function displayFormErrors(errors) {
                if (!Array.isArray(errors)) return;
                errors.forEach(error => {
                    if (error.field_id && error.message) {
                        const fieldContainer = findFieldById(error.field_id);
                        if (fieldContainer) {
                            fieldContainer.classList.add('card_form--error');
                            const errorElement = document.createElement('div');
                            errorElement.className = 'card_form__error';
                            errorElement.innerHTML = `
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
