        </div>
        <div class="countdown-separator">:</div>
        <div class="countdown-unit" data-unit="hours">

    <script src="../../invitarium/build/js/timerInline.js"></script>
    <script src="../../invitarium/luxon.min.js"></script>
    <script>
        function updateTimer() {
            const {
                DateTime
            } = luxon; // берём из глобального объекта luxon
            const timerElement = document.getElementById('countdown');

            const params = new URLSearchParams(window.location.search);
            const dateString = params.get('date') || '2026-08-02';
            const targetDate = dateString.includes('T')
                ? DateTime.fromISO(dateString, { zone: 'local' }).toJSDate()
                : DateTime.fromSQL(dateString, { zone: 'local' }).toJSDate();

            const timer = new Timer(timerElement);
            timer.setUnits(["days","hours","minutes","seconds"]);
            timer.setEndDate(targetDate);
        }
        document.addEventListener('DOMContentLoaded', updateTimer);
    </script>
</body>
